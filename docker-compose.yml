

  
# AI Video Agent - Docker Compose Configuration
  
# Orchestrates the AI Video Agent application with all its dependencies
  

services:
  # Main application service
  ai-video-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-video-agent
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    environment:
      # Application settings
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      
      # Audio processing
      - DOWNLOAD_DIR=/app/downloads
      # Optional: use a Netscape-format cookies.txt file for restricted videos
      # - YOUTUBE_COOKIES_FILE=/app/config/youtube-cookies.txt
      - CHUNK_MINUTES=10
      
      # Whisper settings
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      
      # API Keys (loaded from .env file)
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      
      # Database settings
      - VECTOR_DB_DIR=/app/vector_db
    
    volumes:
      # Persist data directories
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./vector_db:/app/vector_db
      
      # Optional: Mount custom config
      # - ./config:/app/config:ro
      # For authenticated YouTube downloads, place cookies.txt in ./config and enable:
      # - ./config:/app/config:ro
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Networks
    networks:
      - ai-video-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

