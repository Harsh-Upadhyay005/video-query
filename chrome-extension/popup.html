<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #fdfcf0;
      color: #1a1a1a;
      padding: 16px;
      margin: 0;
    }
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .mark {
      width: 28px; height: 28px;
      background: #1a1a1a; color: #fff;
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 14px;
    }
    .name { font-weight: 700; font-size: 15px; }
    p { font-size: 12px; color: #6b6b6b; line-height: 1.55; margin-bottom: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 36px;
      border-radius: 10px; border: none;
      background: #1a1a1a; color: #fff;
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    .btn:hover { opacity: 0.85; }
    .btn-outline {
      margin-top: 6px;
      background: transparent;
      border: 1.5px solid rgba(0,0,0,0.15);
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="mark">V</div>
    <span class="name">VideoQuery</span>
  </div>
  <p>Navigate to a YouTube video, then click the <strong>"Analyze with VideoQuery"</strong> button that appears in the YouTube action bar.</p>
  <a class="btn" href="https://video-query.vercel.app" target="_blank">Open Full Web App</a>
  <a class="btn btn-outline" href="https://www.youtube.com" target="_blank">Go to YouTube</a>
</body>
</html>
